name: secret-scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 扫描密钥 / 凭据
        run: python scripts/check_secrets.py

      - name: 语法检查
        run: python -m py_compile scripts/collect.py scripts/check_secrets.py tests/mock_api.py
